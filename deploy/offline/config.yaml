tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash
tools:
# === 搜索配置 ===
- name: web_search
  group: web
  use: deerflow.community.ddg_search.tools:web_search_tool
  max_results: 5
  # 备选: searxng(自托管搜索,内网友好)
  # use: deerflow.community.searxng.tools:web_search_tool
  # base_url: http://searxng:8080
- name: web_fetch
  group: web
  use: deerflow.community.browserless.tools:web_fetch_tool
  base_url: http://browserless:3000
  timeout_s: 30
  # 备选: jina_ai(Reader API,需Key)
  # use: deerflow.community.jina_ai.tools:web_fetch_tool
  # timeout: 10
  # 备选: crawl4ai(自托管爬虫,JS重页面,无需Key)
  # use: deerflow.community.crawl4ai.tools:web_fetch_tool
  # base_url: http://localhost:11235
  # timeout: 30
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: web_capture                          # Browserless 截图(自托管,无需Key)
  group: web
  use: deerflow.community.browserless.tools:web_capture_tool

  # === 需 API Key 的社区模块(占位,获取 Key 后取消注释即可激活) ===
