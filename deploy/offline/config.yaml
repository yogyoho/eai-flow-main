  #   group: web
  #   use: deerflow.community.groundroute.tools:web_search_tool
  #   max_results: 5
  # Firecrawl — 网页批量抓取,需 FIRECRAWL_API_KEY
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.firecrawl.tools:web_fetch_tool
  # fastCRW — Firecrawl 兼容抓取,需 CRW_API_KEY
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.fastcrw.tools:web_fetch_tool
  #   max_results: 5
  # InfoQuest — AI 搜索问答,需 INFOQUEST_API_KEY
  # - name: web_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:web_search_tool
  #   max_results: 5
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  group: file:write
  use: deerflow.sandbox.tools:write_file_tool
- name: str_replace
  group: file:write
  use: deerflow.sandbox.tools:str_replace_tool
- name: bash
  group: bash
  use: deerflow.sandbox.tools:bash_tool
tool_search:
  enabled: false
input_polish:
  enabled: true
  max_chars: 4000
  model_name: null   # null = use default chat model; set to fast model for lower latency
uploads:
  auto_convert_documents: true
  pdf_converter: auto
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: true
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
skills:
  container_path: /mnt/skills
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
ui:
  show_tool_output: false
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: "请用中文对以下对话进行简洁总结。保留关键事实、决策、用户偏好和待办事项。输出格式：先用1-2句话概括主题，再列出3-5个关键点。"
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
agents_api:
  enabled: true
skill_evolution:
  enabled: false
  moderation_model_name: null
suggestions:
  enabled: true
# EAI-CUSTOM (2026-08-29): 核心库 sqlite→postgres，与开发环境对齐。legacy `checkpointer:`
# 节已删（checkpointer 优先级高于 database，留着会导致 checkpoint/Store 仍走 sqlite）——
# 统一 database 节驱动 checkpointer+Store+应用数据。复用 postgres-ext 实例的独立 `deerflow`
# 库，勿与 extensions 的 agentflow 库共用（同名表 users/roles 冲突；temporal 各用各库不冲突）。
# 库不存在时 gateway 启动自建（自动 CREATE DATABASE）。
# 两个前置条件：
#   1. 镜像须含 postgres 驱动（psycopg/langgraph-checkpoint-postgres）——离线镜像由
#      scripts/offline-export.sh 从 dev 导出，dev 已设 UV_EXTRAS=postgres,memory-zh。
#   2. 线程/checkpoint 数据随之迁出 ./data 进入 named volume prod-postgres-ext-data，
#      备份/升级须同时 pg_dump agentflow + deerflow 两个库（见 MANUAL-UPGRADE §6 / upgrade.sh）。
# postgres_url 中密码须与 .env 的 POSTGRES_EXT_PASSWORD 保持一致。
database:
  backend: postgres
  postgres_url: postgresql://agentflow:agentflow123@postgres-ext:5432/deerflow
  # 内网防火墙常掐空闲连接，5 分钟回收 ORM 连接池防 "server closed the connection"
  pool_recycle: 300
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
run_events:
  # EAI-CUSTOM (2026-08-30, bug-3017): .env GATEWAY_WORKERS=4 下 deps.py 启动门要求
  # run_events.backend=db（memory/JSONL 是进程局部，跨 worker 单例保证不成立）。
  backend: db
  max_trace_content: 10240
  track_token_usage: true
# EAI-CUSTOM (2026-08-30, bug-3017): 同一门要求 heartbeat_enabled=true（否则滚动更新时
# Worker B 会把 Worker A 的在跑 run 当孤儿杀掉）。单 worker 部署开启亦无害。
run_ownership:
  lease_seconds: 30
  grace_seconds: 10
  heartbeat_enabled: true
# EAI-CUSTOM (2026-08-30): 与 dev config.yaml 对齐——启用原生 subagent 批处理调度器
# （database.backend=postgres 已使 repository_available=true）。
subagent_batches:
  enabled: true
tool_output:
  enabled: true
  externalize_min_chars: 12000
  preview_head_chars: 2000
  preview_tail_chars: 1000
  fallback_max_chars: 30000
  fallback_head_chars: 8000
  fallback_tail_chars: 3000
  storage_subdir: .tool-results
  exempt_tools:
  - read_file
  - read_file_tool
safety_finish_reason:
  enabled: true

# User-owned IM channel connections (E-续 ③). Built for bot_token/binding-code
# providers (feishu/dingtalk/etc.) where an admin pastes credentials in the 渠道
# tab. WeChat/iLink is QR-based (token auto-generated on scan) so it does NOT fit
# this model — it runs via the system `channels.wechat` + QR login below instead.
# wechat is therefore left out of channel_connections to avoid a meaningless
# "连接 / Bot token" prompt in the sidebar.
channel_connections:
  enabled: true
  require_bound_identity: false

# System WeChat iLink bot. qrcode_login_enabled triggers the QR bootstrap on
# first start (no bot_token yet): WechatChannel._bind_via_qrcode() fetches a QR
# from ilinkai.weixin.qq.com, logs it, and polls get_qrcode_status until you
# scan+confirm, then obtains and persists the bot_token automatically.
channels:
  wechat:
    enabled: true
    qrcode_login_enabled: true
    state_dir: /app/backend/.deer-flow/channels/wechat
    # Access control: only WeChat users who bind via /connect <code> (linked to
    # their DeerFlow account) may use the bot. Unbound senders get a "link first"
    # prompt. The connection_repo + binding flow are enabled by channels.wechat.
    require_bound_identity: true

# ── Subagent system ──
subagents:
  custom_agents:
    petrochem-utilities-agent:
      description: 石化设计院公用工程室AI助手 — 管理给排水、消防、暖通、管道设计专篇编写。消防用已有skill，给排水用多轮交互模式（参数确认→公式计算→章节生成→一致性校验→合规检查）。
      system_prompt: |
        你是石化设计院公用工程室的AI助手。

        管辖范围：给排水设计、消防设计、暖通设计、管道设计。

        执行模式：
        - 消防专篇 → 调度已有skill (fire-protection-extract / fire-protection-report-v2)，不干预生成
        - 给排水专篇 → 你亲自管理多轮交互：参数确认→公式计算→章节生成→一致性校验→合规检查

        核心铁律：
        1. 公式计算结果必须用户审核后才能写入报告
        2. 参数变更自动传播到所有下游公式（增量重算）
        3. 跨章节/跨专业数据不一致→阻断，强制用户对齐
        4. 不编造数据，无法获取的值标注[待补充]
        5. 每步等待用户确认后再进入下一步
      skills:
        - fire-protection-extract
        - fire-protection-report-v2
        - water-drainage-report
      model: inherit
      max_turns: 30
      timeout_seconds: 1800
