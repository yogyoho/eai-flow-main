# =============================================================================
# EAI-Flow 生产离线部署 — 扩展服务（次级常驻服务合集）
# =============================================================================
# 本文件聚合所有「非核心、非 RAGFlow」的常驻服务（原 temporal.yaml +
# mcp-cad.yaml 已并入，减少 compose 文件数）。包含：
#   - postgres-ext : Extensions 主库（用户/文档/知识库/合同价/license镜像）
#   - collab       : 协同编辑 WebSocket（Hocuspocus）
#   - temporal     : 工作流引擎（可选；不启用工作流可注释掉）
#   - cad / text-to-cad / ocr / cad-viewer : CAD 解析/生成 + 合同价 OCR + 3D 预览
#   - browserless  : 无头 Chrome（可选，默认注释；供 web_fetch/web_capture 渲染 JS 页）
# 核心服务（nginx/frontend/gateway）在 docker-compose.yaml；RAGFlow 栈在
# docker-compose.ragflow.yaml（独立，保留 --no-ragflow 可选性）。
# =============================================================================

services:
  # ── Extensions PostgreSQL ──────────────────────────────────────────────────
  postgres-ext:
    image: postgres:16-alpine
    container_name: prod-eai-flow-postgres-ext
    environment:
      - POSTGRES_USER=${POSTGRES_EXT_USER:-agentflow}
      - POSTGRES_PASSWORD=${POSTGRES_EXT_PASSWORD:-agentflow123}
      - POSTGRES_DB=${POSTGRES_EXT_DB:-agentflow}
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - prod-postgres-ext-data:/var/lib/postgresql/data
      # One-shot init scripts (creates temporal role + DBs on fresh init).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_EXT_PORT:-15432}:5432"
    networks:
      - prod-eai-flow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_EXT_USER:-agentflow} -d ${POSTGRES_EXT_DB:-agentflow}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── Collaboration WebSocket Server (Hocuspocus) ────────────────────────────
  collab:
    image: eai-flow-collab:${IMAGE_TAG:-latest}
    container_name: prod-eai-flow-collab
    depends_on:
      postgres-ext:
        condition: service_healthy
    environment:
      - COLLAB_PORT=8002
      - DATABASE_URL=postgresql://${POSTGRES_EXT_USER:-agentflow}:${POSTGRES_EXT_PASSWORD:-agentflow123}@postgres-ext:5432/${POSTGRES_EXT_DB:-agentflow}
    env_file:
      - .env
    networks:
      - prod-eai-flow-net
    restart: unless-stopped

  # ── Knowledge Factory MCP Server (HTTP 长驻,与 dev 对齐) ───────────────────
  # 独立长驻 HTTP 进程,避免 stdio 冷启动竞态(agent 高频发现工具时反复 fork 子进程
  # + import 重依赖 + 连 DB 超时 → "knowledge factory unavailable")。
  # 复用 gateway 镜像(后端已含 http_server 模块);MCP_TRANSPORT/HOST/PORT 走
  # environment(与 cad/text-to-cad 一致),加入 prod-eai-flow-net 供 gateway 访问。
  knowledge-factory:
    image: deer-flow-gateway:${IMAGE_TAG:-latest}
    container_name: prod-eai-flow-knowledge-factory
    depends_on:
      postgres-ext:
        condition: service_healthy
    command: sh -c "cd backend && PYTHONPATH=. uv run --no-sync python -m app.extensions.knowledge_factory.mcp_server.http_server"
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
      - KF_DATABASE_URL=postgresql+asyncpg://${POSTGRES_EXT_USER:-agentflow}:${POSTGRES_EXT_PASSWORD:-agentflow123}@postgres-ext:5432/${POSTGRES_EXT_DB:-agentflow}
    networks:
      - prod-eai-flow-net
    restart: unless-stopped

  # ── OntoStudio Backend（本体建模独立服务 :8005，S1 Task 3）─────────────────
  # 镜像离线交付：offline-export.sh 的 BUILD_SERVICES 已含 ontostudio-backend（build 后
  # re-tag 为 eai-flow-ontostudio-backend）。API 经 nginx /api/ontostudio/ 代理（同源
  # cookie 鉴权）；MCP streamable-http 双端点由 gateway extensions_config http 条目容器
  # 直连。profiles=["ontostudio"]: 按需安装——
  #   docker compose -p eai-prod -f <四文件> --profile ontostudio up -d ontostudio-backend
  ontostudio-backend:
    image: eai-flow-ontostudio-backend:${IMAGE_TAG:-latest}
    container_name: prod-eai-flow-ontostudio-backend
    profiles:
      - ontostudio
    # Network alias `ontostudio`: extensions_config.json 的 MCP URL 主机名
    # (http://ontostudio:8005/mcp/*) 依赖此 DNS 别名——照 dev compose 的
    # text-to-cad/cad 先例（无 alias = DNS NXDOMAIN, MCP 通道全断）。
    # Rollback: 删除 aliases 块并同时把 extensions_config.json 两端点
    # enabled 翻 false（离线默认关,见 .env ONTOSTUDIO_PROFILE 说明）。
    depends_on:
      postgres-ext:
        condition: service_healthy
    ports:
      # 与开发环境 (eai-docker) 同机共存则 .env 里改 ONTOSTUDIO_PORT=18005 避免冲突
      - "${ONTOSTUDIO_PORT:-8005}:8005"
    environment:
      # extensions DB（字段名照 ontostudio app/config.py DatabaseConfig.from_env 读取）
      - EXTENSIONS_DB_HOST=postgres-ext
      - EXTENSIONS_DB_PORT=5432
      - EXTENSIONS_DB_USER=${POSTGRES_EXT_USER:-agentflow}
      - EXTENSIONS_DB_PASSWORD=${POSTGRES_EXT_PASSWORD:-agentflow123}
      - EXTENSIONS_DB_NAME=${POSTGRES_EXT_DB:-agentflow}
      # JWT 与 gateway 同源（.env 的 AUTH_JWT_SECRET；两侧均未设置则 503 fail-closed）
      - ONTOSTUDIO_JWT_SECRET=${AUTH_JWT_SECRET:-}
      # MCP 传输层共享 token（未设置=内网匿名开放；.env 追加 ONTOSTUDIO_INTERNAL_AUTH_TOKEN
      # 后自动收紧，须与 gateway extensions_config ontostudio 条目 headers 同值）
      - ONTOSTUDIO_INTERNAL_AUTH_TOKEN=${ONTOSTUDIO_INTERNAL_AUTH_TOKEN:-}
      # v2 授权委托（app/auth.py）：gateway cookie 无角色 claims，携带原样 Cookie 反查
      # gateway /api/permissions/me 判 system:access；默认 compose 网络服务名 gateway
      - ONTOSTUDIO_GATEWAY_URL=${ONTOSTUDIO_GATEWAY_URL:-http://gateway:8001}
      - ONTOSTUDIO_CORS_ORIGINS=${ONTOSTUDIO_CORS_ORIGINS:-http://localhost:${PORT:-4026}}
      # EAI-CUSTOM (P0-3): 内核图持久化（同 dev compose）。未设置 = 内存态，重建容器即归零。
      - ONTOSTUDIO_KERNEL_PATH=/data/kernel
    volumes:
      - prod-ontostudio-kernel:/data
    env_file:
      - .env
    networks:
      prod-eai-flow-net:
        aliases:
          - ontostudio
    restart: unless-stopped
    # slim 镜像无 curl → python urllib 探活
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── OntoStudio Frontend（独立 Vite SPA 静态托管 :3010，S2 Task 3）─────────
  # 镜像离线交付：offline-export.sh 的 BUILD_SERVICES 已含 ontostudio-frontend（build 后
  # re-tag 为 eai-flow-ontostudio-frontend）。页面经 nginx /ontostudio/ 代理（前缀
  # 透传，产物 base=/ontostudio/ 同前缀，SPA 深链容器侧 try_files 回退）；不暴露
  # 宿主端口。profiles=["ontostudio"] 同 backend——
  #   docker compose -p eai-prod -f <四文件> --profile ontostudio up -d ontostudio-frontend
  ontostudio-frontend:
    image: eai-flow-ontostudio-frontend:${IMAGE_TAG:-latest}
    container_name: prod-eai-flow-ontostudio-frontend
    profiles:
      - ontostudio
    # API 依赖 ontostudio-backend（经 nginx /api/ontostudio/ 转发，容器间无直连），
    # 不加 depends_on；两服务同 profile 一起起。
    healthcheck:
      # nginx:alpine 自带 busybox wget；127.0.0.1 而非 localhost（容器内 localhost 先
      # 解析 ::1，nginx 默认只绑 IPv4 → Connection refused 恒 unhealthy）
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3010/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - prod-eai-flow-net
    restart: unless-stopped

  # ── Temporal 工作流引擎 ────────────────────────────────────────────────────
  # 不使用工作流模块可整段注释掉。首次部署若 postgres 数据卷非空，需手动补建
  # temporal 角色（见 MANUAL-DEPLOY 步骤 14 / cutover.md 坑4）。
  temporal:
    image: temporalio/auto-setup:1.27.0
    container_name: prod-eai-flow-temporal
    depends_on:
      postgres-ext:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal_password
      - POSTGRES_SEEDS=postgres-ext
    networks:
      - prod-eai-flow-net
    ports:
      - "${TEMPORAL_PORT:-17233}:7233"
    restart: unless-stopped

  # ── 合同价格 OCR (rapid-layout + rapid-table + rapidocr) ──────────────────
  # 模型已烘焙进镜像，完全离线可用，无需运行时下载。
  ocr:
    image: eai-flow-ocr:latest
    container_name: prod-eai-flow-ocr
    environment:
      - OCR_HOST=0.0.0.0
      - OCR_PORT=8010
    networks:
      - prod-eai-flow-net
    restart: unless-stopped
    
  # ── CAD Suite (merged: text-to-cad + cad/EDP + cad-viewer) ────────────────
  # 2026-09-11 三容器合并为一:一个镜像跑 text-to-cad MCP(:8004)+ cad/EDP MCP
  # (:8003)+ cad-viewer(:4178),离线只交付一个 eai-flow-cad-suite:latest。
  # 服务名/别名必须保持 cad/text-to-cad/ocr —— 与 extensions_config.json 的
  # MCP url (http://cad:8003/mcp, http://text-to-cad:8004/mcp) 和 gateway
  # 环境变量 OCR_SERVICE_URL=http://ocr:8010 对齐（Docker DNS 按服务名/别名解析）。
  # 离线环境共享 ./data（容器内 /data）。
  cad-suite:
    image: eai-flow-cad-suite:latest
    container_name: prod-eai-flow-cad-suite
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      # 默认(text-to-cad)端口;supervisor 对 cad-mcp 覆盖为 8003。
      - MCP_PORT=8004
      - CAD_DATA_ROOT=/data
      # EAI-CUSTOM (2026-09-15): 预览链接的浏览器可达地址（缺省 127.0.0.1:4178 用户点不开）
      - CAD_VIEWER_URL=${CAD_VIEWER_URL:-http://localhost:4178}
    volumes:
      - ./data:/data:rw
    ports:
      # cad-viewer:用户浏览器直接访问 :4178 查看 STEP/GLB/STL。专用生产服务器
      # 用默认 4178;与开发环境 (eai-docker) 同机共存则改为 14178 避免冲突。
      - "${CAD_VIEWER_PORT:-4178}:4178"
    networks:
      prod-eai-flow-net:
        aliases:
          - text-to-cad
          - cad
    restart: unless-stopped

  # ── Browserless（无头 Chrome，供 web_fetch/web_capture 渲染 JS 网页）──────
  # EAI-CUSTOM: 可选服务，默认注释。理由：(1) 离线部署中 web_fetch/web_capture
  # 主要用于抓内网页面（外网页面无外网抓不到）；(2) offline-export 是 local-only，
  # 若把 browserless/chrome:1 加进 PUBLIC_IMAGES 而开发机没 pull，导出会硬失败。
  # 需要时启用步骤：
  #   1. 取消下面整段注释；
  #   2. 开发机执行 docker pull browserless/chrome:1（必须是 v1 API；:latest 是 v2，API 不兼容）；
  #   3. 把 "browserless/chrome:1" 加入 scripts/offline-export.sh 的 PUBLIC_IMAGES；
  #   4. config.yaml 的 web_fetch/web_capture base_url 已是 http://browserless:3000。
  # browserless:
  #   image: browserless/chrome:1
  #   container_name: prod-eai-flow-browserless
  #   environment:
  #     - MAX_CONCURRENT_SESSIONS=10
  #     - TOKEN=${BROWSERLESS_TOKEN:-}
  #   networks:
  #     - prod-eai-flow-net
  #   restart: unless-stopped

volumes:
  prod-postgres-ext-data:
  # EAI-CUSTOM (P0-3): OntoStudio 内核图（pyoxigraph 目录），重建容器不归零。
  prod-ontostudio-kernel:

networks:
  prod-eai-flow-net:
    external: true
    name: eai-prod_eai-flow-net
