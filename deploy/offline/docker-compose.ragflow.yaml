# =============================================================================
# EAI-Flow 生产离线部署 — RAGFlow 知识库服务栈（v1.0 main 线 + EAI SSO）
# =============================================================================
# EAI-CUSTOM 2026-10-24: 随 dev 升级到 RAGFlow main 线编译版（镜像 ragflow-dev:main，
# 含 pisuan-custom EAI SSO patch），v0.27.x 模板整体退役（bug-3101 的 v0.27.1-fixed 亦退役）。
# 与 v0.27.x 模板的关键差异（均来自 dev docker/docker-compose.ragflow.yaml 实测）：
#   1. image 为 main 线编译版：默认 entrypoint 启动 nginx + API + admin + syncer +
#      ingestor，并先跑一次 Go DB 迁移
#   2. ⚠️ 不得传 --init-model-provider-tables：main 线里它的含义变为"跑迁移然后退出"，
#      容器会迁移完立即退出（仅 v0.27.x 镜像需要该 flag）
#   3. 新增 ragflow-nats（Go ingestion JetStream 队列，v0.27.x 忽略之）+ ragflow-nats-data 卷
#   4. 新增 KVROCKS_HOST=ragflow-redis（Go 后端 cache/queue 走 RESP 协议，复用 redis 容器）
#   5. EAI SSO 信任根注入：EAI_SSO_SHARED_SECRET（两侧同值才启用 SSO 交换）+
#      EAI_SSO_SHARED_TENANT_IDS（SSO 用户提供加入的租户 ids，空 = 特性关）
# ⚠️ v1.0 与 v0.27 数据面不兼容：从 v0.27 升级 = KB 全量重新导入（旧卷改名保留，见升级手册）。
# ⚠️ 镜像来源：ragflow-dev:main 由 RAGFlow main 源码（含 pisuan-custom patch）构建，
#    离线交付 = 开发机 docker save 该镜像随包分发（offline-export.sh 已列入清单）。

services:
  # ── RAGFlow (API + Web UI + admin + syncer + ingestor) ─────────────────────
  ragflow:
    image: ${RAGFLOW_IMAGE:-ragflow-dev:main}
    container_name: prod-eai-flow-ragflow
    # main 线默认 entrypoint（不加任何 --disable-*/--init-* flag）
    command: ["--enable-adminserver"]
    environment:
      # Must match service_conf.yaml.template variable names:
      #   MYSQL_DBNAME (NOT MYSQL_DATABASE)
      #   ES_HOST / ES_USER / ELASTIC_PASSWORD (NOT ES_HOSTS/ES_USERNAME/ES_PASSWORD)
      #   MINIO_HOST (NOT MINIO_ENDPOINT)
      - MYSQL_HOST=ragflow-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-ragflow123}
      - MYSQL_DBNAME=${MYSQL_DBNAME:-ragflow}
      - ES_HOST=ragflow-es
      - ES_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-ragflow123}
      - REDIS_HOST=ragflow-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-ragflow123}
      # Go 后端 cache/queue 走 RESP 协议，复用 redis 容器
      - KVROCKS_HOST=ragflow-redis
      # Go ingestion JetStream
      - NATS_HOST=ragflow-nats
      - NATS_PORT=4222
      # pisuan-custom begin — EAI SSO trust root；两侧同值才启用 SSO 交换
      - EAI_SSO_SHARED_SECRET=${EAI_SSO_SHARED_SECRET:?set EAI_SSO_SHARED_SECRET in .env}
      # SSO 用户提供加入的租户 ids（逗号分隔；空 = 特性关）
      - EAI_SSO_SHARED_TENANT_IDS=${EAI_SSO_SHARED_TENANT_IDS:-}
      # pisuan-custom end
      - MINIO_HOST=ragflow-minio
      - MINIO_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
      # SECRET_KEY 固定值持久化在 .env（重启/升级一律不得变更）
      - SECRET_KEY=${RAGFLOW_SECRET_KEY:?set RAGFLOW_SECRET_KEY in .env}
      - API_PROXY_SCHEME=python
      # 内网需代理时填 RAGFLOW_HTTP_PROXY；NO_PROXY 保证内部服务不走代理
      - HTTP_PROXY=${RAGFLOW_HTTP_PROXY:-}
      - HTTPS_PROXY=${RAGFLOW_HTTP_PROXY:-}
      - http_proxy=${RAGFLOW_HTTP_PROXY:-}
      - https_proxy=${RAGFLOW_HTTP_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,.local,ragflow-mysql,ragflow-es,ragflow-redis,ragflow-minio,ragflow-nats
      - no_proxy=localhost,127.0.0.1,.local,ragflow-mysql,ragflow-es,ragflow-redis,ragflow-minio,ragflow-nats
    volumes:
      # 只挂日志目录。严禁把 named volume 挂在 /ragflow 本体：会遮蔽镜像内应用代码。
      - prod-ragflow-logs:/ragflow/logs
    ports:
      - "${RAGFLOW_PORT:-19380}:9380"      # API
      - "${RAGFLOW_WEB_PORT:-19381}:80"    # Web UI（内部 nginx）
    depends_on:
      ragflow-mysql:
        condition: service_healthy
      ragflow-es:
        condition: service_healthy
      ragflow-redis:
        condition: service_healthy
      ragflow-minio:
        condition: service_healthy
      ragflow-nats:
        condition: service_healthy
    networks:
      - prod-eai-flow-net
    restart: unless-stopped

  # ── NATS（Go ingestion JetStream 队列；端口仅内网）────────────────────────
  ragflow-nats:
    image: nats:2.14.2
    container_name: prod-eai-flow-ragflow-nats
    command: -js -sd /data --http_port 8222
    volumes:
      - prod-ragflow-nats-data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--health-check"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - prod-eai-flow-net
    restart: unless-stopped

  # ── Elasticsearch ──────────────────────────────────────────────────────────
  ragflow-es:
    image: elasticsearch:8.11.3
    container_name: prod-eai-flow-ragflow-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-ragflow123}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    # 官方镜像 entrypoint 需要可写的 /tmp（ACL 修复，与上游一致）
    tmpfs:
      - /tmp:mode=1777,size=512m
    volumes:
      - prod-ragflow-es-data:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT:-19200}:9200"
    networks:
      - prod-eai-flow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD:-ragflow123} http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── MySQL ──────────────────────────────────────────────────────────────────
  ragflow-mysql:
    image: mysql:8.0
    container_name: prod-eai-flow-ragflow-mysql
    # flags 与上游 base compose 一致（native auth 插件/utf8mb4/连接数余量）
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-ragflow123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ragflow}
    volumes:
      - prod-ragflow-mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    networks:
      - prod-eai-flow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-ragflow123}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Redis ──────────────────────────────────────────────────────────────────
  ragflow-redis:
    image: redis:7-alpine
    container_name: prod-eai-flow-ragflow-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-ragflow123}
    volumes:
      - prod-ragflow-redis-data:/data
    ports:
      - "${REDIS_PORT:-16379}:6379"
    networks:
      - prod-eai-flow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ragflow123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ──────────────────────────────────────────────────────────────────
  # 注意：此 MinIO 同时是 contract_price / geo_samples / knowledge 对象存储的唯后端，
  # 不要在裁剪 RAGFlow 栈时把它一并去掉。
  ragflow-minio:
    image: minio/minio:latest
    container_name: prod-eai-flow-ragflow-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - prod-ragflow-minio-data:/data
    ports:
      - "${MINIO_API_PORT:-19100}:9000"
      - "${MINIO_CONSOLE_PORT:-19101}:9001"
    networks:
      - prod-eai-flow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prod-ragflow-logs:
  prod-ragflow-es-data:
  prod-ragflow-mysql-data:
  prod-ragflow-redis-data:
  prod-ragflow-minio-data:
  prod-ragflow-nats-data:

networks:
  prod-eai-flow-net:
    external: true
    name: eai-prod_eai-flow-net
