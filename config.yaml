config_version: 40
log_level: info
logging:
  enhance:
    enabled: false
    format: text
token_usage:
  enabled: true
token_budget:
  enabled: false
  max_tokens: 200000
  max_input_tokens: null
  max_output_tokens: null
  warn_threshold: 0.8
  hard_stop_threshold: 1.0
max_recursion_limit: 1000
models:
- name: agnes-2.5-Flash
  display_name: Agnes-2.5-Flash
  use: langchain_openai:ChatOpenAI
  model: agnes-2.5-flash
  api_key: $AGNES_API_KEY
  base_url: https://apihub.agnes-ai.com/v1/
  request_timeout: 600.0
  max_tokens: 8192
  temperature: 0.7
- name: glm-4.1v-flash
  display_name: GLM-4.1v-flash (智谱官方)
  use: langchain_openai:ChatOpenAI
  model: glm-4.1v-thinking-flash
  api_key: $ZHIPU_API_KEY
  base_url: https://open.bigmodel.cn/api/paas/v4/
  request_timeout: 300.0
  max_tokens: 8192
  temperature: 0.7
  supports_thinking: true
  supports_vision: false
  when_thinking_enabled:
    extra_body:
      thinking:
        type: enabled
  when_thinking_disabled:
    extra_body:
      thinking:
        type: disabled
- name: gemma-4
  display_name: gemma-4-E4B（llama.cpp）
  use: langchain_openai:ChatOpenAI
  model: unsloth/gemma-4-E4B-it-GGUF:UD-Q4_K_XL
  api_key: not-needed
  base_url: http://192.168.2.38:8080/v1
  timeout: 600.0
  max_retries: 2
  supports_thinking: true
  supports_vision: false
  supports_reasoning_effort: true
  when_thinking_enabled:
    extra_body:
      thinking:
        type: enabled
  when_thinking_disabled:
    extra_body:
      thinking:
        type: disabled
- name: deepseek-v4-flash
  display_name: DeepSeek V4 Flash
  use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  model: deepseek-v4-flash
  api_key: $DEEPSEEK_API_KEY
  timeout: 60.0
  max_retries: 1
  max_tokens: 8192
  supports_thinking: true
  supports_vision: false
  when_thinking_enabled:
    extra_body:
      thinking:
        type: enabled
  when_thinking_disabled:
    extra_body:
      thinking:
        type: disabled
tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash
- name: browser
- name: knowledge
tools:
- name: web_search
  group: web
  use: deerflow.community.ddg_search.tools:web_search_tool
  max_results: 5
- name: web_fetch
  group: web
  use: deerflow.community.browserless.tools:web_fetch_tool
  base_url: http://browserless:3000
  timeout_s: 30
- name: web_capture
  group: web
  use: deerflow.community.browserless.tools:web_capture_tool
  base_url: http://browserless:3000
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  group: file:write
  use: deerflow.sandbox.tools:write_file_tool
- name: str_replace
  group: file:write
  use: deerflow.sandbox.tools:str_replace_tool
- name: bash
  group: bash
  use: deerflow.sandbox.tools:bash_tool
tool_search:
  enabled: true
  auto_promote_top_k: 3
tool_output:
  enabled: true
  externalize_min_chars: 12000
  preview_head_chars: 2000
  preview_tail_chars: 1000
  fallback_max_chars: 30000
  fallback_head_chars: 8000
  fallback_tail_chars: 3000
  storage_subdir: .tool-results
  exempt_tools:
  - read_file
  - read_file_tool
suggestions:
  enabled: true
  max_suggestions: 3
input_polish:
  enabled: true
  max_chars: 4000
  model_name: null
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 15
  tool_freq_hard_limit: 25
  tool_freq_overrides:
    bash:
      warn: 40
      hard_limit: 60
read_before_write:
  enabled: true
safety_finish_reason:
  enabled: true
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: true
  pdf_converter: auto
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: true
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
  bash_command_timeout: 600
subagents:
  max_total_per_run: 16
  custom_agents:
    petrochem-utilities-agent:
      description: 石化设计院公用工程室AI助手 — 管理给排水、消防、暖通、管道设计专篇编写。消防用已有skill，给排水用多轮交互模式（参数确认→公式计算→章节生成→一致性校验→合规检查）。
      system_prompt: '你是石化设计院公用工程室的AI助手。


        管辖范围：给排水设计、消防设计、暖通设计、管道设计。


        执行模式：

        - 消防专篇 → 调度已有skill (fire-protection-extract / fire-protection-report-v2)，不干预生成

        - 给排水专篇 → 你亲自管理多轮交互：参数确认→公式计算→章节生成→一致性校验→合规检查


        核心铁律：

        1. 公式计算结果必须用户审核后才能写入报告

        2. 参数变更自动传播到所有下游公式（增量重算）

        3. 跨章节/跨专业数据不一致→阻断，强制用户对齐

        4. 不编造数据，无法获取的值标注[待补充]

        5. 每步等待用户确认后再进入下一步

        '
      skills:
      - fire-protection-extract
      - fire-protection-report-v2
      - water-drainage-report
      model: inherit
      max_turns: 30
      timeout_seconds: 1800
subagent_batches:
  enabled: true
  poll_interval_seconds: 1
  lease_seconds: 120
  max_items_per_batch: 5000
  default_max_live_items: 100
  max_live_items_per_batch: 1000
  default_max_running_items: 3
  max_running_items_per_batch: 64
  max_attempts: 3
  max_result_chars: 100000
  result_preview_max_chars: 2000
skills:
  container_path: /mnt/skills
skill_scan:
  enabled: true
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 80000
  keep:
    type: messages
    value: 30
  trim_tokens_to_summarize: 40000
  summary_prompt: '请把以下对话内容合并为一份最新的结构化任务笔记，用于在上下文压缩后恢复工作状态。


    规则：

    - 若含 <existing_summary> 块则为既有笔记：在它基础上增量更新（保留仍有效的内容、更新已变化的、删除已过时的），不要推倒重写

    - <new_messages> 块为自上次总结以来的新增对话

    - 工具调用的原始返回一律省略，只保留结论

    - 对话中出现过的任务笔记/工作文件路径必须原样保留（如 /mnt/user-data/workspace/TASK.md）

    - 用户明确表达的偏好和约束以「用户要求：」标注，不可丢失


    输出格式（四个固定小节，标题原样保留，无内容的节写"无"）：

    ## 当前目标

    正在进行的任务目标（1-2 句）


    ## 已做决定

    关键决策及理由：方案选型、用户确认的偏好等


    ## 已完成与改动

    已完成的工作、创建/修改过的文件与配置、重要工具调用的结论


    ## 下一步

    待办事项、未解决问题、下一步行动


    以下为待总结内容：

    {messages}

    '
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: true
  injection_enabled: true
  shutdown_flush_timeout_seconds: 30.0
  manager_class: deermem
  mode: middleware
  backend_config:
    storage_path: ''
    storage_class: file
    strict_user_scope: false
    manifest_filename: memory.json
    file_lock_timeout_seconds: 10
    retrieval_adapter: fts5
    debounce_seconds: 30
    queue_max_depth: 1000
    model: null
    max_facts: 100
    fact_confidence_threshold: 0.7
    max_injection_tokens: 2000
    token_counting: char
    guaranteed_categories:
    - correction
    guaranteed_token_budget: 500
    staleness_review_enabled: true
    staleness_age_days: 90
    staleness_min_candidates: 3
    staleness_max_removals_per_cycle: 10
    staleness_protected_categories:
    - correction
    staleness_max_lifetime_multiplier: 20.0
    staleness_max_extension_days: 3650
    consolidation_enabled: false
    consolidation_min_facts: 8
    consolidation_max_groups_per_cycle: 3
    consolidation_max_sources: 8
agents_api:
  enabled: true
skill_evolution:
  enabled: false
  moderation_model_name: null
  security_fail_closed: true
database:
