# OntoStudio frontend SPA — nginx:alpine 运行时配置（S2 Task 3, EAI-CUSTOM）。
# 主系统 nginx :2026 将 /ontostudio/* 反代到本容器 :3010（前缀透传，不改写 URI），
# 故本 server 按 /ontostudio/ 前缀定位（alias 剥前缀）。产物 base=/ontostudio/
# （vite.config.ts），index.html 引用的资产均为 /ontostudio/assets/*；深链/刷新由
# try_files 回退 index.html（SPA fallback）。
server {
    listen 3010;
    server_name _;

    root /usr/share/nginx/html;

    # 指纹静态资产长缓存（immutable：内容变则文件名变）
    location /ontostudio/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 入口 + 路由回退
    location /ontostudio/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /ontostudio/index.html;
    }

    # 探活端点（compose healthcheck / 运维探针；不暴露应用信息）
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
