# OntoStudio kernel CONSTRUCT 派生规则（spec 2026-09-18 §3）
# 每规则结果独立 named graph: graph:derived:<name>；查询自带 PREFIX（自包含）。
# 可见域 = graph:asserted ∪ graph:alignment；不读 entailment（层间单向无环）。
# sameas_propagation 为内置规则（rules.py BUILTIN_SAMEAS_PROPAGATION），不在此重复。
# 注意：谓词 IRI 含 '/'，SPARQL 前缀名局部部分未转义 '/' 非法——一律写全 IRI <>。
rules:
  - name: org_in_ecosystem
    construct: >
      CONSTRUCT { ?a <https://ontology.eai-flow.com/doc_graph#predicate/org_in_ecosystem_of> ?c }
      WHERE {
        GRAPH <graph:asserted> {
          ?a <https://ontology.eai-flow.com/doc_graph#predicate/org_compiles_project> ?b .
          ?b <https://ontology.eai-flow.com/doc_graph#predicate/org_parent_of> ?c .
        }
      }
  - name: qualified_bidder
    # Phase B 验收问题 #3：具备项目所需全部资质的投标人（CQ 驱动，验收对照推理工作台页）
    construct: >
      CONSTRUCT { ?b <https://ontology.eai-flow.com/doc_graph#predicate/bidder_qualified_for> ?p }
      WHERE {
        GRAPH <graph:asserted> {
          ?b <https://ontology.eai-flow.com/doc_graph#predicate/bidder_of_project> ?p .
          ?p <https://ontology.eai-flow.com/doc_graph#predicate/requires_qualification> ?q .
          ?b <https://ontology.eai-flow.com/doc_graph#predicate/bidder_holds_qualification> ?q .
          FILTER NOT EXISTS {
            ?p <https://ontology.eai-flow.com/doc_graph#predicate/requires_qualification> ?q2 .
            FILTER NOT EXISTS { ?b <https://ontology.eai-flow.com/doc_graph#predicate/bidder_holds_qualification> ?q2 }
          }
        }
      }
