# 文档图谱域（doc_graph 构建侧产物——非结构化文档抽取的实体/关系/证据）
# 设计: docs/superpowers/specs/2026-09-11-ontology-doc-graph-design.md
# 表模型: backend/app/extensions/ontology/doc_graph/tables.py（逐列核对）
object_types:
  - api_name: graph_entity
    display_name: 图谱实体
    description: 从非结构化文档抽取的实体（项目/投标人/货物/资质, etype 区分）
    domain: doc_graph
    icon: 🧩
    access:
      path: postgres_ext
      table: dg_entities
    pk:
      column: id
      api_name: id
      type: uuid
    properties:
      - { name: id, api_name: id, type: uuid, description: 主键 }
      - { name: domain, api_name: domain, type: string, description: 抽取域, filterable: true }
      - { name: etype, api_name: etype, type: string, description: 实体类型, filterable: true, enum: [project, bidder, goods, qualification, mine, org, place, sensitive_point] }
      - { name: canonical_name, api_name: canonicalName, type: string, description: 规范名, searchable: true }
      - { name: norm_name, api_name: normName, type: string, description: 归一化名 }
      - { name: attrs, api_name: attrs, type: json, description: 属性 }
      - { name: confidence, api_name: confidence, type: number, description: 抽取置信度, filterable: true }
      - { name: status, api_name: status, type: string, description: 状态, filterable: true, enum: [active, pending_review, merged, rejected] }
      - { name: valid_from, api_name: validFrom, type: datetime, description: 业务有效期起 }
      - { name: valid_to, api_name: validTo, type: datetime, description: 业务有效期止 }
      - { name: created_at, api_name: createdAt, type: datetime, description: 创建时间 }
    # 动作层数据范围（设计 §3）：值取 permissions.yaml 的模块 key。Task 6 前该模块
    # data_scopes 为空 → 解析为 none_allow（动作一律 404），属预期。
    scope_resource: ontology

  - api_name: graph_relation
    display_name: 图谱关系
    description: 实体间关系行（predicate 区分：投标方/供货/资质/中标）
    domain: doc_graph
    icon: 🔗
    access:
      path: postgres_ext
      table: dg_relations
    pk:
      column: id
      api_name: id
      type: uuid
    properties:
      - { name: id, api_name: id, type: uuid, description: 主键 }
      - { name: subject_id, api_name: subjectId, type: uuid, description: 主体实体, indexed: true, filterable: true }
      # org_involved_in = 推理派生谓词（规则 derive 结论, 仅存在于 evaluate_rules 返回值, 不落库——
      # 写侧 doc_graph/schemas.py 的 _PREDICATE Literal 不含它, 抽取校验不受影响）
      - { name: predicate, api_name: predicate, type: string, description: 谓词, indexed: true, filterable: true, enum: [bidder_of_project, bidder_supplies_goods, bidder_holds_qualification, project_won_by_bidder, org_compiles_project, org_commissions_project, org_develops_project, org_involved_in] }
      - { name: object_id, api_name: objectId, type: uuid, description: 客体实体, indexed: true, filterable: true }
      - { name: attrs, api_name: attrs, type: json, description: 属性 }
      - { name: confidence, api_name: confidence, type: number, description: 抽取置信度, filterable: true }
      - { name: valid_from, api_name: validFrom, type: datetime, description: 业务有效期起 }
      - { name: valid_to, api_name: validTo, type: datetime, description: 业务有效期止 }
      - { name: created_at, api_name: createdAt, type: datetime, description: 创建时间 }

  - api_name: graph_mention
    display_name: 图谱证据
    description: mention 级证据链（文档+原文引用, 永不删）——实体/关系的溯源依据
    domain: doc_graph
    icon: 📎
    access:
      path: postgres_ext
      table: dg_mentions
    pk:
      column: id
      api_name: id
      type: uuid
    properties:
      - { name: id, api_name: id, type: uuid, description: 主键 }
      - { name: entity_id, api_name: entityId, type: uuid, description: 指向实体, indexed: true, filterable: true }
      - { name: relation_id, api_name: relationId, type: uuid, description: 指向关系, indexed: true, filterable: true }
      - { name: thread_id, api_name: threadId, type: string, description: 来源会话, filterable: true }
      - { name: document_id, api_name: documentId, type: string, description: 来源文档, filterable: true }
      - { name: doc_span, api_name: docSpan, type: json, description: 文档内定位 }
      - { name: quote, api_name: quote, type: string, description: 原文引用 }
      - { name: extracted_by, api_name: extractedBy, type: string, description: 抽取者 }
      - { name: extracted_at, api_name: extractedAt, type: datetime, description: 抽取时间 }
      - { name: error, api_name: error, type: string, description: 抽取错误(可重投) }

link_types:
  - api_name: relation_subject
    display_name: 关系主体
    source: graph_relation
    target: graph_entity
    cardinality: N:1
    reverse: entity_as_subject
    join:
      type: foreign_key
      source_column: subject_id
      target_column: id

  - api_name: relation_object
    display_name: 关系客体
    source: graph_relation
    target: graph_entity
    cardinality: N:1
    reverse: entity_as_object
    join:
      type: foreign_key
      source_column: object_id
      target_column: id

  - api_name: mention_of_entity
    display_name: 证据指向实体
    source: graph_mention
    target: graph_entity
    cardinality: N:1
    reverse: entity_has_mentions
    join:
      type: foreign_key
      source_column: entity_id
      target_column: id

  - api_name: mention_of_relation
    display_name: 证据指向关系
    source: graph_mention
    target: graph_relation
    cardinality: N:1
    reverse: relation_has_mentions
    join:
      type: foreign_key
      source_column: relation_id
      target_column: id

# 动作层（设计 §1.1）：审核抽取实体。写路径经 executor 单条管线，
# 业务状态与 dg_action_audit 审计行同事务落库。
actions:
  - id: review_entity.confirm
    display_name: 确认实体
    description: 将待审抽取实体置为 active，同一事务内记审计
    domain: doc_graph
    target: graph_entity
    required_permissions: [ontology:action:review]
    preconditions:
      - { field: status, op: eq, value: pending_review }
    postconditions:
      - { field: status, set: active }
  - id: review_entity.reject
    display_name: 驳回实体
    description: 将待审抽取实体置为 rejected，同一事务内记审计
    domain: doc_graph
    target: graph_entity
    required_permissions: [ontology:action:review]
    preconditions:
      - { field: status, op: eq, value: pending_review }
    postconditions:
      - { field: status, set: rejected }
