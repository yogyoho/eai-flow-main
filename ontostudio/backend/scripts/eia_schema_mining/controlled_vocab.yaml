    - { name: 悬浮物, aliases: ["SS", "悬浮物(SS)"] }
    - { name: 石油类, aliases: ["油类"] }
    - { name: 总铁, aliases: [] }
    - { name: 总锰, aliases: [] }
    - { name: 氟化物, aliases: ["F-"] }
    - { name: pH, aliases: ["pH值"] }
    - { name: 矿化度, aliases: ["溶解性总固体", "TDS"] }
