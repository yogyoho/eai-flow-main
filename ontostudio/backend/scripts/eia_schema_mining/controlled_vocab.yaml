# 环评 v2 受控词表初稿（spec §4.3）——T3 后随 schema 定型并入 eia.yaml 或独立维护
# aliases 即抽取归一同义词：LLM 抽取与表格解析命中 alias 时统一归到 name
# 2026-09-30 归并挖掘（eia_pattern_mine.py）按图内实测碎片变体增补：悬浮物 aliases、disposal_target_concept 表
pollutant_concept:
  code_source: HJ 524
  concepts:
    - { name: 二氧化硫, aliases: ["SO2", "SO₂", "二氧化硫(SO2)"] }
    - { name: 氮氧化物, aliases: ["NOx", "NOX", "氮氧化物(NOx)"] }
    - { name: 颗粒物, aliases: ["烟尘", "粉尘", "TSP", "PM10", "PM2.5"] }
    - { name: 化学需氧量, aliases: ["COD", "CODCr", "化学需氧量(COD)"] }
    - { name: 氨氮, aliases: ["NH3-N", "氨氮(NH3-N)"] }
    # 悬浮/悬浮性固体: 2026-09-30 图内碎片变体实测补充
    - { name: 悬浮物, aliases: ["SS", "悬浮物(SS)", "悬浮", "悬浮性固体"] }
    # 生化需氧量/动植物油: 2026-10-01 三批——复合污染物名全分解解锁（cod、bod5、ss、石油类 等）+ bod/bod5 平行条目归并
    - { name: 生化需氧量, aliases: ["BOD", "BOD5"] }
    - { name: 动植物油, aliases: [] }
    - { name: 石油类, aliases: ["油类"] }
    - { name: 总铁, aliases: [] }
    - { name: 总锰, aliases: [] }
    - { name: 氟化物, aliases: ["F-"] }
    - { name: pH, aliases: ["pH值"] }
    - { name: 矿化度, aliases: ["溶解性总固体", "TDS"] }
measure_process_concept:
  concepts:
    - { name: 布袋除尘, aliases: ["袋式除尘", "脉冲布袋除尘", "布袋除尘器"] }
    - { name: 双碱法脱硫, aliases: ["双碱法", "钠钙双碱法脱硫"] }
    - { name: 低氮燃烧, aliases: ["低氮燃烧器", "低氮改造"] }
    - { name: 混凝沉淀, aliases: ["混凝气浮", "絮凝沉淀"] }
    - { name: 超滤, aliases: ["UF", "超滤反渗透", "反渗透除盐"] }
    - { name: 隔声屏障, aliases: ["声屏障", "隔声窗"] }
    - { name: 矸石井下充填, aliases: ["充填开采", "井下充填系统"] }
    - { name: 瓦斯抽采, aliases: ["瓦斯抽放", "瓦斯综合利用"] }
    # 伊敏矿区同一受纳设施的同名异写（2026-10-01 三批；治理宾语=measure 作用域生效）
    - { name: 伊敏河镇污水处理厂, aliases: ["伊敏污水处理厂", "伊敏镇生活污水处理厂"] }
pollution_process_concept:
  concepts:
    - { name: 凿岩爆破, aliases: ["爆破", "井下爆破"] }
    - { name: 掘进出矸, aliases: ["掘进", "岩巷掘进"] }
    - { name: 采煤落煤, aliases: ["落煤", "割煤"] }
    - { name: 转载点, aliases: ["转载", "转运点"] }
    - { name: 巷道通风, aliases: ["风排瓦斯", "矿井通风"] }
    - { name: 瓦斯抽采环节, aliases: [] }
    - { name: 筛分破碎, aliases: ["筛分", "破碎"] }
    - { name: 储煤场, aliases: ["储煤场扬尘", "原煤储存"] }
    - { name: 装卸车, aliases: ["装车", "煤炭装卸"] }
    - { name: 运输道路, aliases: ["道路扬尘", "公路运输"] }
    - { name: 锅炉房, aliases: ["燃煤锅炉"] }
    - { name: 矿井水处理站, aliases: ["矿井水处理"] }
    - { name: 生活污水处理站, aliases: ["生活污水处理"] }
    - { name: 煤泥水系统, aliases: ["煤泥水闭路循环"] }
# 处置去向概念（2026-09-30 eia_pattern_mine 归并挖掘新增表）：图内「有资质单位」多表述
# 各自成对是处置规律最大噪声簇——B 库蒸馏按概念归并，具体受托公司名保持原样不入表。
# 2026-09-30 二批：处置头部实测碎片族（井下充填 ~17 写法 / 沉陷区充填 / 露天采坑回填 /
# 市政垃圾处理厂 / 场地平整），别名全部取自图内实体名；规范名取库中已存在写法以最大化连边。
# 语义边界（明确不并，留残差）：填埋≠焚烧不并；排土场/周转场（堆存）与充填（处置）不并；
# 填沟造地、黄土掩埋、不出井、合理处置/无害化处置率 等去向声明不并；公司名（受托方/焚烧发电厂）保持原样。
