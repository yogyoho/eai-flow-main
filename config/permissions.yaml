# permissions.yaml — 三级权限模型：导航 → 页面 → 操作
# 格式版本，用于检测不兼容变更时告警
version: 3

modules:
  # ─── 工作台 ───
  dashboard:
    display_name: "工作台"
    nav_id: "nav:dashboard"
    pages:
      - id: "dashboard:page:overview"
        display_name: "工作台概览"
        operations:
          - { id: "dashboard:view", display_name: "查看工作台" }

  # ─── 智能写作 ───
  writing:
    display_name: "智能写作"
    nav_id: "nav:writing"
    pages:
      - id: "writing:page:chat"
        display_name: "AI 对话写作"
        operations:
          - { id: "model:read", display_name: "使用 AI 模型" }

  # ─── 报告项目 ───
  projects:
    display_name: "报告项目"
    nav_id: "nav:projects"
    pages:
      - id: "projects:page:list"
        display_name: "项目列表"
        operations:
          - { id: "project:create", display_name: "创建项目" }
          - { id: "project:edit", display_name: "编辑项目" }
          - { id: "project:delete", display_name: "删除项目" }
          - { id: "project:read", display_name: "查看项目" }
          - { id: "member:add", display_name: "添加成员" }
          - { id: "member:remove", display_name: "移除成员" }
          - { id: "chapter:write_own", display_name: "编写自己的章节" }
          - { id: "chapter:write_any", display_name: "编写任意章节" }
          - { id: "chapter:review", display_name: "审核章节" }
          - { id: "chapter:review_any", display_name: "审核任意章节" }
          - { id: "approval:submit", display_name: "提交审批" }
          - { id: "approval:review", display_name: "审批审核" }
          - { id: "approval:approve", display_name: "批准" }
          - { id: "approval:view", display_name: "查看审批" }
          - { id: "ai:start_writing", display_name: "启动 AI 写作" }
          - { id: "outline:edit", display_name: "编辑大纲" }
          - { id: "settings:edit", display_name: "编辑项目设置" }
          - { id: "export:generate", display_name: "生成导出" }
          - { id: "version:rollback", display_name: "版本回滚" }
          - { id: "workflow:read", display_name: "查看工作流" }
          - { id: "workflow:start", display_name: "启动工作流" }
          - { id: "workflow:cancel", display_name: "取消工作流" }
          - { id: "workflow:edit", display_name: "编辑工作流" }
          - { id: "chapter:view_all", display_name: "查看全部章节/来源" }
          - { id: "ai:stop_writing", display_name: "停止 AI 写作" }
    data_scopes:
      - { id: "project_member", display_name: "参与的项目", rule_template: { id IN: "$identity.member_projects" } }
      - { id: "project_all", display_name: "全部项目", rule_template: {} }

  # ─── 文档空间 ───
  docmgr:
    display_name: "文档空间"
    nav_id: "nav:docmgr"
    pages:
      - id: "docmgr:page:browse"
        display_name: "文档浏览"
        operations:
          - { id: "doc:read", display_name: "查看文档" }
          - { id: "doc:upload", display_name: "上传文档" }
          - { id: "doc:delete", display_name: "删除文档" }

  # ─── 知识库 ───
  knowledge:
    display_name: "知识库"
    nav_id: "nav:knowledge"
    pages:
      - id: "knowledge:page:browse"
        display_name: "浏览知识库"
        operations:
          - { id: "kb:read", display_name: "查看知识库" }
          - { id: "kb:create", display_name: "创建知识库" }
          - { id: "kb:update", display_name: "编辑知识库" }
          - { id: "kb:delete", display_name: "删除知识库" }
          - { id: "kb:upload", display_name: "上传文档" }
    data_scopes:
      - { id: "knowledge_owner",  display_name: "仅自己的知识库", rule_template: { owner_id: "$identity.user_id" } }
      - { id: "knowledge_public", display_name: "所有公开知识库", rule_template: { access_type: "public" } }
      - { id: "knowledge_dept",   display_name: "本部门的知识库", rule_template: { and: [ { access_type: "dept" }, { allowed_depts OVERLAP: "$identity.dept_ids" } ] } }

  # ─── 知识工厂（9 个 tab ↔ 9 个 page id）───
  knowledge_factory:
    display_name: "知识工厂"
    nav_id: "nav:knowledge-factory"
    pages:
      - id: "kf:page:sample"
        display_name: "样例管理"
      - id: "kf:page:extraction"
        display_name: "模板抽取"
      - id: "kf:page:template"
        display_name: "模板编辑"
      - id: "kf:page:law"
        display_name: "法规标准"
      - id: "kf:page:compliance"
        display_name: "合规规则"
      - id: "kf:page:version"
        display_name: "版本管理"
      - id: "kf:page:quality"
        display_name: "质量评估"
      - id: "kf:page:scrape"
        display_name: "网页爬取"
      - id: "kf:page:dict"
        display_name: "业务字典"

  # ─── 合同价格分析（应用中心 → 采购管理）───
  contract_price:
    display_name: "合同价格分析"
    nav_id: "nav:contract-price"
    pages:
      - id: "cpa:page:overview"
        display_name: "总览"
      - id: "cpa:page:contracts"
        display_name: "合同解析"
      - id: "cpa:page:items"
        display_name: "分项校验"
        operations: []
      - id: "cpa:page:clusters"
        display_name: "分组审核"
        operations: []
      - id: "cpa:page:tasks"
        display_name: "任务中心"
        operations: []
      - id: "cpa:page:settings"
        display_name: "配置"
        operations: []
    data_scopes:
      - { id: "cpa_all", display_name: "全部合同数据", rule_template: {} }
      - { id: "cpa_dept", display_name: "本部门合同", rule_template: { dept_id IN: "$identity.dept_ids" } }

  # ─── 报告输出（应用中心 → 报告输出）───
  output:
    display_name: "报告输出"
    nav_id: "nav:output"
    pages:
      - id: "output:page:index"
        display_name: "报告输出"
        operations:
          - { id: "export:generate", display_name: "生成导出" }

  # ─── 流程管理（应用中心 → 流程管理，admin_only）───
  workflow_admin:
    display_name: "流程管理"
    nav_id: "nav:workflow-admin"
    admin_only: true
    pages:
      - id: "workflow-admin:page:index"
        display_name: "流程管理"
        operations:
          - { id: "workflow:read", display_name: "查看工作流" }
          - { id: "project:advance", display_name: "推进工作流" }

  # ─── 系统管理 ───
  admin:
    display_name: "系统管理"
    nav_id: "nav:admin"
    pages:
      - id: "admin:page:users"
        display_name: "用户管理"
        operations:
          - { id: "user:read", display_name: "查看用户" }
          - { id: "user:create", display_name: "创建用户" }
          - { id: "user:update", display_name: "编辑用户" }
          - { id: "user:delete", display_name: "删除用户" }
      - id: "admin:page:roles"
        display_name: "角色管理"
        operations:
          - { id: "role:read", display_name: "查看角色" }
          - { id: "role:create", display_name: "创建角色" }
          - { id: "role:update", display_name: "编辑角色" }
          - { id: "role:delete", display_name: "删除角色" }
      - id: "admin:page:departments"
        display_name: "部门管理"
        operations:
          - { id: "department:create", display_name: "创建部门" }
          - { id: "department:update", display_name: "编辑部门" }
          - { id: "department:delete", display_name: "删除部门" }
      - id: "admin:page:app-center"
        display_name: "应用管理"
        operations:
          - { id: "app_center:manage", display_name: "管理应用中心", admin_only: true }

  # ─── 设置 ───
  settings:
    display_name: "设置"
    nav_id: "nav:settings"
    pages:
      - id: "settings:page:general"
        display_name: "基本设置"
        operations:
          - { id: "system:access", display_name: "访问系统设置" }
      - id: "settings:page:datasource"
        display_name: "数据源"
        operations: []
      - id: "settings:page:license"
        display_name: "许可证"
        operations:
          - { id: "license:manage", display_name: "管理许可证", admin_only: true }

  # ─── 应用中心 ───
  # 前端 Sidebar.tsx 引用 nav:app-center，但 permissions.yaml 漏了此模块 →
  # superadmin 的 nav:["*"] 展开后不含 nav:app-center → 应用中心不显示
  app_center:
    display_name: "应用中心"
    nav_id: "nav:app-center"
    pages: []

# ── 角色默认映射 ──
roles:
  superadmin:
    display_name: "超级管理员"
    is_system: true
    level: 100
    nav: ["*"]
    pages: ["*"]
    permissions: ["*"]

  dept_head:
    display_name: "部门负责人"
    is_system: false
    level: 50
    nav:
      - nav:dashboard
      - nav:writing
      - nav:projects
      - nav:docmgr
      - nav:knowledge
      - nav:knowledge-factory
      - nav:contract-price
      - nav:output
      - nav:app-center
    pages: ["*"]
    permissions:
      # EAI-CUSTOM (Task17): 预备授权 dashboard:view —— dashboard/approval/law 路由当前仍强制 system:access，
      # 此点为将来切换到模块级粒度（dashboard:view 等）做准备，先让持 nav:dashboard 的角色持有该权限，勿删除
      - dashboard:view
      - kb:read
      - kb:create
      # EAI-CUSTOM: U2 button-level can() gates upload/delete/edit on these; dept_head manages KB content
      - kb:upload
      - kb:update
      - kb:delete
      - doc:read
      - doc:upload
      - project:create
      - project:read
      - model:read
      - system:access
      - workflow:read
      - approval:approve
      - approval:submit
      - approval:view
      - chapter:review
    data_scopes: ["knowledge_dept", "cpa_dept", "project_member"]

  project_manager:
    display_name: "项目经理"
    is_system: false
    level: 60
    nav:
      - nav:dashboard
      - nav:writing
      - nav:projects
      - nav:docmgr
      - nav:knowledge
      - nav:output
      - nav:app-center
    pages: ["*"]
    permissions:
      - "#inherit:dept_head"
      - dashboard:view
      - project:edit
      - member:add
      - member:remove
      - chapter:write_any
      - ai:start_writing
      - outline:edit
      - settings:edit
      - export:generate
      - approval:submit
      - approval:review
    data_scopes: ["project_member", "knowledge_dept", "cpa_dept"]

  writer:
    display_name: "撰写人"
    is_system: false
    level: 10
    nav: [nav:dashboard, nav:writing, nav:projects, nav:knowledge, nav:app-center]
    pages: [projects:page:list, writing:page:chat, knowledge:page:browse, dashboard:page:overview]
    permissions:
      - dashboard:view
      - kb:read
      - doc:read
      - model:read
      - system:access
      - chapter:write_own
      - chapter:review
      - ai:start_writing
      - workflow:read
    data_scopes: ["project_member", "knowledge_dept"]

  reviewer:
    display_name: "审核员"
    is_system: false
    level: 20
    nav: [nav:dashboard, nav:projects, nav:knowledge, nav:app-center]
    pages: [projects:page:list, knowledge:page:browse, dashboard:page:overview]
    permissions:
      - dashboard:view
      - kb:read
      - doc:read
      - model:read
      - system:access
      - chapter:review
      - approval:review
      - workflow:read
    data_scopes: ["project_member", "knowledge_dept"]

  # 最小可信基线：新自动桥接用户的默认权限（yaml 权威）
  # registry `user` role now grants only [kb:read, doc:read, model:read, system:access]
  # vs the old 18-perm _ROLE_DEFAULTS["user"] — this is intentional least-privilege.
  user:
    display_name: "普通用户"
    is_system: false
    level: 1
    nav: [nav:dashboard, nav:knowledge, nav:app-center]
    pages: [knowledge:page:browse, dashboard:page:overview]
    permissions:
      - dashboard:view
      - kb:read
      - doc:read
      - model:read
      - system:access
    data_scopes: ["knowledge_public", "project_member"]

# ── 项目级角色 → 权限映射（原 role_permissions 表 / DEFAULT_ROLE_PERMISSIONS 常量）──
project_roles:
  owner:      [project:edit, project:delete, member:add, member:remove, chapter:write_any, chapter:review_any, ai:start_writing, ai:stop_writing, approval:submit, approval:review, approval:approve, workflow:start, workflow:cancel, settings:edit, export:generate]
  phase_lead: [chapter:write_any, chapter:review_any, ai:start_writing, approval:submit, member:add, outline:edit]
  writer:     [chapter:write_own, chapter:confirm]
  reviewer:   [chapter:review, approval:review]
  approver:   [approval:approve, approval:view]
