    # overlay 是运行时真相源，须与 permissions.yaml base 同步（bug-1087 wholesale-replace 教训）
    - user:read
    - workflow:start
    - workflow:cancel
    - workflow:edit
    - chapter:view_all
    - ai:stop_writing
    nav:
    - nav:writing
    - nav:projects
    - nav:docmgr
    - nav:knowledge
    - nav:output
    - nav:app-center
    - nav:knowledge-factory
    - nav:dashboard
    - nav:workflow-admin
