# Business Microservices (EAI-CUSTOM group: eai-ext)
#
# EAI-CUSTOM (2026-11-08 重新归类): sales / workflow / procurement + 共享
# business-db 是 EAI 底座（eai-docker 组）之上扩展出来的业务子系统，独立成
# eai-ext 组管理，不再随 eai-docker 全量栈起飞：
#
#   cd docker && docker compose -p eai-ext -f docker-compose.business.yaml up -d
#   cd docker && docker compose -p eai-ext -f docker-compose.business.yaml down
#
# 组成（workflow 平台由下方 include 自动带入，无需再加 -f）:
#   - business-db:            统一业务 PostgreSQL（procurement/sales/workflow 库）
#   - procurement-backend:    采购 API (port 3001)
#   - procurement-frontend:   采购 UI
#   - sales-backend:          销售 QW2 API (port 3004)
#   - sales-worker:           销售 Temporal worker + outbox
#   - sales-frontend:         销售 Vite SPA
#   - workflow-db-init / workflow-migrate / workflow-backend / workflow-worker /
#     workflow-dispatcher / workflow-frontend: 工作流平台（见 workflow.yaml）
#
# 联动: 与底座共享外部网络 eai-docker_eai-flow-net（nginx 按容器名路由，
# /sales/* /workflow/* 直接打到 eai-ext 容器）；business-db-data 卷钉死为
# eai-docker 时期的活数据卷（见 volumes 段）。
# 命名: 容器名用 eai-ext-* 前缀——2026-10-22 曾有一次漏带 -p 的启动把
# eai-flow-* 名字注册到了死项目 `docker` 下（11 个 Exited 遗留容器，保留
# 不删）；Docker 容器名全局唯一，故新组换名避开。nginx 走 compose service
# 名 DNS alias（sales-backend/workflow-backend 等），不受 container_name
# 影响，路由零改动。
# Temporal 依赖: eai-flow-temporal 属于底座组（docker-compose.temporal.yaml），
# eai-ext 的 worker 们通过共享网络连 temporal:7233。

include:
  - docker-compose.workflow.yaml

services:
  # ── Unified Business PostgreSQL ────────────────────────────────────────
  business-db:
    image: postgres:16-alpine
    container_name: eai-ext-business-db
    environment:
      - POSTGRES_USER=${BUSINESS_DB_USER:-business}
      - POSTGRES_PASSWORD=${BUSINESS_DB_PASSWORD:-business123}
      - POSTGRES_DB=postgres
    volumes:
      - business-db-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${BUSINESS_DB_PORT:-5433}:5432"
    networks:
      - eai-flow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BUSINESS_DB_USER:-business}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── Procurement Backend ────────────────────────────────────────────────
  procurement-backend:
    build:
      context: ../business/procurement-service/backend
      dockerfile: Dockerfile
    container_name: eai-ext-procurement-backend
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 3001 --workers 2
    environment:
      - DATABASE_URL=${PROCUREMENT_DATABASE_URL:-postgresql+asyncpg://${BUSINESS_DB_USER:-business}:${BUSINESS_DB_PASSWORD:-business123}@business-db:5432/procurement}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - API_PREFIX=/api/v1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - ../.env
    depends_on:
      business-db:
        condition: service_healthy
    networks:
      - eai-flow-net
    restart: unless-stopped

  # ── Procurement Frontend ───────────────────────────────────────────────
  procurement-frontend:
    build:
      context: ../business/procurement-service/frontend-shadcn
      dockerfile: Dockerfile
    container_name: eai-ext-procurement-frontend
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=http://localhost:${PORT:-2026}/procurement
    networks:
      - eai-flow-net
    restart: unless-stopped
    healthcheck:
      # EAI-CUSTOM (bug-4254): `localhost` resolves to ::1 inside the container and
      # nginx binds IPv4 only, so the check always got "connection refused" while
      # the service itself was fine. Pin 127.0.0.1 (same as sales-frontend).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Asset Backend ──────────────────────────────────────────────────────
  # asset-backend:
  #   build:
  #     context: ../business/asset-service/backend
  #     dockerfile: Dockerfile
  #   container_name: eai-flow-asset-backend
  #   command: uv run uvicorn app.main:app --host 0.0.0.0 --port 3002 --workers 2
  #   environment:
  #     - DATABASE_URL=${ASSET_DATABASE_URL:-postgresql+asyncpg://${BUSINESS_DB_USER:-business}:${BUSINESS_DB_PASSWORD:-business123}@business-db:5432/asset}
  #     - JWT_SECRET_KEY=${JWT_SECRET_KEY}
  #     - JWT_ALGORITHM=HS256
  #     - ACCESS_TOKEN_EXPIRE_MINUTES=1440
  #     - API_PREFIX=/api/v1
  #     - LOG_LEVEL=${LOG_LEVEL:-INFO}
  #   env_file:
  #     - ../.env
  #   depends_on:
  #     business-db:
  #       condition: service_healthy
  #   networks:
  #     - eai-flow-net
  #   restart: unless-stopped

  # ── Asset Frontend ─────────────────────────────────────────────────────
  # asset-frontend:
  #   build:
  #     context: ../business/asset-service/frontend
  #     dockerfile: Dockerfile
  #   container_name: eai-flow-asset-frontend
  #   environment:
  #     - NEXT_PUBLIC_API_BASE_URL=
  #     - NEXT_PUBLIC_APP_BASE_URL=
  #   networks:
  #     - eai-flow-net
  #   restart: unless-stopped

  # ── Project Backend ────────────────────────────────────────────────────
  # project-backend:
  #   build:
  #     context: ../business/project-service/backend
  #     dockerfile: Dockerfile
  #   container_name: eai-flow-project-backend
  #   command: uv run uvicorn app.main:app --host 0.0.0.0 --port 3003 --workers 2
  #   environment:
  #     - DATABASE_URL=${PROJECT_DATABASE_URL:-postgresql+asyncpg://${BUSINESS_DB_USER:-business}:${BUSINESS_DB_PASSWORD:-business123}@business-db:5432/project}
  #     - JWT_SECRET_KEY=${JWT_SECRET_KEY}
  #     - JWT_ALGORITHM=HS256
  #     - ACCESS_TOKEN_EXPIRE_MINUTES=1440
  #     - API_PREFIX=/api/v1
  #     - LOG_LEVEL=${LOG_LEVEL:-INFO}
  #   env_file:
  #     - ../.env
  #   depends_on:
  #     business-db:
  #       condition: service_healthy
  #   networks:
  #     - eai-flow-net
  #   restart: unless-stopped

  # ── Project Frontend ───────────────────────────────────────────────────
  # project-frontend:
  #   build:
  #     context: ../business/project-service/frontend
  #     dockerfile: Dockerfile
  #   container_name: eai-flow-project-frontend
  #   environment:
  #     - NEXT_PUBLIC_API_BASE_URL=
  #     - NEXT_PUBLIC_APP_BASE_URL=
  #   networks:
  #     - eai-flow-net
  #   restart: unless-stopped

  # ── Sales QW2 Backend (A01 + C1 + A02 + approvals) ────────────────────
  sales-backend:
    build:
      context: ../business/sales-service/backend
      dockerfile: Dockerfile
      args:
        # Tsinghua mirror by default for fast builds in China; override with
        # PIP_INDEX_URL=https://pypi.org/simple to build against official PyPI.
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: eai-ext-sales-backend
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 3004 --workers 1
    environment:
      - DATABASE_URL=${SALES_DATABASE_URL:-postgresql+asyncpg://${BUSINESS_DB_USER:-business}:${BUSINESS_DB_PASSWORD:-business123}@business-db:5432/sales}
      - JWT_ALGORITHM=HS256
      - API_PREFIX=/api/v1
      - AUTH_MODE=eai
      - EAI_BASE_URL=http://gateway:8001
      - EAI_TIMEOUT_SECONDS=4
      - PERMISSION_CACHE_TTL_SECONDS=60
      - SALES_BOOTSTRAP_PERMISSIONS=true
      - SALES_EMBEDDED_WORKER=false
      - TEMPORAL_ENABLED=true
      - TEMPORAL_URL=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=sales-approval-queue
      - TEMPORAL_RPC_TIMEOUT_SECONDS=5
      - WORKFLOW_PLATFORM_ENABLED=${WORKFLOW_PLATFORM_ENABLED:-true}
      - WORKFLOW_PLATFORM_BASE_URL=${WORKFLOW_PLATFORM_BASE_URL:-http://workflow-backend:8020/api/workflow}
      - WORKFLOW_PLATFORM_INTERNAL_TOKEN=${WORKFLOW_INTERNAL_TOKEN:-}
      - WORKFLOW_PLATFORM_TIMEOUT_SECONDS=10
      - SCHEDULER_ENABLED=true
      - SEED_DEMO=${SALES_SEED_DEMO:-false}
      - MINIO_ENABLED=true
      - MINIO_ENDPOINT=http://ragflow-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=sales-attachments
      - MINIO_SECURE=false
      - MAX_ATTACHMENT_BYTES=${SALES_MAX_ATTACHMENT_BYTES:-26214400}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - path: ../.env
        required: false
    depends_on:
      business-db:
        condition: service_healthy
    networks:
      - eai-flow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3004/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── Sales QW2 Worker (Temporal workflows + transactional outbox) ───────
  sales-worker:
    build:
      context: ../business/sales-service/backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: eai-ext-sales-worker
    command: python -m app.worker
    environment:
      - DATABASE_URL=${SALES_DATABASE_URL:-postgresql+asyncpg://${BUSINESS_DB_USER:-business}:${BUSINESS_DB_PASSWORD:-business123}@business-db:5432/sales}
      - AUTH_MODE=eai
      - EAI_BASE_URL=http://gateway:8001
      - TEMPORAL_ENABLED=true
      - TEMPORAL_URL=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=sales-approval-queue
      - TEMPORAL_RPC_TIMEOUT_SECONDS=5
      - TEMPORAL_RECONCILE_INTERVAL_SECONDS=300
      - TEMPORAL_RECONCILE_STALE_SECONDS=120
      - OUTBOX_MAX_ATTEMPTS=10
      - OUTBOX_DISPATCH_INTERVAL_SECONDS=3
      - MINIO_ENABLED=true
      - MINIO_ENDPOINT=http://ragflow-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=sales-attachments
      - MINIO_SECURE=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - path: ../.env
        required: false
    depends_on:
      business-db:
        condition: service_healthy
      sales-backend:
        condition: service_started
    networks:
      - eai-flow-net
    restart: unless-stopped

  # ── Sales QW2 Frontend (Vite SPA, nginx) ───────────────────────────────
  sales-frontend:
    build:
      context: ../business/sales-service/frontend
      dockerfile: Dockerfile
      additional_contexts:
        workflow_embed: ../packages/workflow-embed
    container_name: eai-ext-sales-frontend
    environment:
      - NODE_ENV=production
    networks:
      - eai-flow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ | grep -q '<div id=\"root\">' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  business-db-data:
    # EAI-CUSTOM (2026-11-08 重新归类): pin the real volume name. This cluster
    # was born under the eai-docker group (live data since 2026-04, ~98M) and
    # was adopted intact by the eai-ext group. Without `name:` compose would
    # prefix it to eai-ext_business-db-data and boot an EMPTY cluster next to
    # the real data. Keep the pin; do not "clean up" the prefix.
    name: eai-docker_business-db-data

networks:
  eai-flow-net:
    external: true
    name: eai-docker_eai-flow-net
