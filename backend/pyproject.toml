[project]
name = "deer-flow"
version = "0.1.0"
description = "LangGraph-based AI agent system with sandbox execution capabilities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deerflow-harness",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.27",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    # Direct dependency on purpose, even though FastAPI already pulls it in:
    # app/gateway/request_path.py imports the private
    # `starlette._utils.get_route_path` so the auth and CSRF predicates
    # classify the exact string Starlette's router matches on (upstream #4780).
    "starlette>=1.3.1,<2",
    "lark-oapi>=1.4.0",
    "slack-sdk>=3.33.0",
    "python-telegram-bot>=21.0",
    "langgraph-sdk>=0.1.51",
    "markdown-to-mrkdwn>=0.3.1",
    "wecom-aibot-python-sdk>=0.1.6",
    "dingtalk-stream>=0.24.3",
    "langchain-ollama[ollama]>=1.1.0",
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
    # WeChat message AES + at-rest encryption for persisted channel-connection
    # credentials (deerflow.persistence.channel_connections.sql cipher).
    "cryptography>=43.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "email-validator>=2.0.0",
    "aiofiles>=23.0.0",
    "minio>=7.0.0",
    "temporalio[pydantic]>=1.27.0",
    "python-docx>=1.2.0",
    # contract-price-analysis skill pipeline (run as subprocess inside gateway).
    # NOTE: deliberately NOT using scikit-learn — it pulls scipy (~33MB) which
    # fails to download on flaky networks and blocks gateway startup. The skill's
    # clustering is numpy-only (see scripts/clustering/).
    "xlsxwriter>=3.2.0",
]

[project.optional-dependencies]
postgres = ["deerflow-harness[postgres]"]
discord = ["discord.py>=2.7.0"]

[dependency-groups]
dev = [
    "blockbuster>=1.5.26,<1.6",
    "prompt-toolkit>=3.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
]
# Managed extension packages are added here by `deerflow extensions install`
# (upstream #4780). Keeping them separate from development tooling lets every
# startup mode sync the same locked runtime set without promoting those
# packages to core deps.
extensions = []

[tool.pytest.ini_options]
markers = [
    "no_auto_user: disable the conftest autouse contextvar fixture for this test",
    "allow_blocking_io: opt out of the strict Blockbuster gate in tests/blocking_io/",
]

[tool.uv]
index-url = "https://pypi.org/simple"
default-groups = ["dev", "extensions"]
# Pin these transitive deps to bytedance/main exact versions.
# 2026-07-23: upgraded to langchain 1.3.14 + langgraph 1.2.9 (#4292 DeltaChannel).
# Removed langchain-core==1.3.3 constraint (now 1.4.9 via langchain 1.3.14).
# Removed starlette/aiohttp/cryptography constraints (let langchain 1.3 pull compatible).
constraint-dependencies = [
    "langsmith==0.8.0",
    "python-multipart==0.0.31",
    "pyjwt==2.13.0",
    "urllib3==2.7.0",
    "idna==3.15",
    "mako==1.3.12",
]

[tool.uv.workspace]
members = ["packages/harness", "packages/extension-api"]

[tool.uv.sources]
deerflow-harness = { workspace = true }
deerflow-extension-api = { workspace = true }
