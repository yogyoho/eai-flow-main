[project]
name = "deer-flow"
version = "0.1.0"
description = "LangGraph-based AI agent system with sandbox execution capabilities"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deerflow-harness",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.27",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    "lark-oapi>=1.4.0",
    "slack-sdk>=3.33.0",
    "python-telegram-bot>=21.0",
    "langgraph-sdk>=0.1.51",
    "markdown-to-mrkdwn>=0.3.1",
    "wecom-aibot-python-sdk>=0.1.6",
    "dingtalk-stream>=0.24.3",
    "langchain-ollama[ollama]>=1.1.0",
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
    # WeChat message AES + at-rest encryption for persisted channel-connection
    # credentials (deerflow.persistence.channel_connections.sql cipher).
    "cryptography>=43.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "email-validator>=2.0.0",
    "aiofiles>=23.0.0",
    "minio>=7.0.0",
    "temporalio[pydantic]>=1.27.0",
    "python-docx>=1.2.0",
    # contract-price-analysis skill pipeline (run as subprocess inside gateway).
    # NOTE: deliberately NOT using scikit-learn — it pulls scipy (~33MB) which
    # fails to download on flaky networks and blocks gateway startup. The skill's
    # clustering is numpy-only (see scripts/clustering/).
    "xlsxwriter>=3.2.0",
]

[project.optional-dependencies]
postgres = ["deerflow-harness[postgres]"]
discord = ["discord.py>=2.7.0"]

[dependency-groups]
dev = [
    "blockbuster>=1.5.26,<1.6",
    "prompt-toolkit>=3.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
markers = [
    "no_auto_user: disable the conftest autouse contextvar fixture for this test",
    "allow_blocking_io: opt out of the strict Blockbuster gate in tests/blocking_io/",
]

[tool.uv]
index-url = "https://pypi.org/simple"
# Pin these transitive deps to bytedance/main exact versions.
# Prevents `uv lock` from overshooting to latest-compatible (e.g. langchain-core 1.4.x,
# starlette 1.4.x) which risks the customized gateway/agent code. Update together.
# 2026-06-18: bumped starlette 1.0.1->1.3.1 + aiohttp 3.14.0->3.14.1 + cryptography
# 46.0.7->48.0.1 to track bytedance/main. starlette 1.3.1 validated upstream with the same
# FastAPI 0.136.1 + langchain-core 1.3.3 we run. cryptography==48.0.1 pulls an
# upstream-aligned cascade (langgraph-runtime-inmem 0.28->0.30, langgraph-api 0.8.1->0.10.0,
# grpcio 1.78->1.80, langchain-protocol 0.0.12->0.0.17) -- every version matches bytedance/main.
constraint-dependencies = [
    "starlette==1.3.1",
    "langchain-core==1.3.3",
    "langsmith==0.8.0",
    "aiohttp==3.14.1",
    "cryptography==48.0.1",
    "python-multipart==0.0.31",
    "pyjwt==2.13.0",
    "urllib3==2.7.0",
    "idna==3.15",
    "mako==1.3.12",
]

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
deerflow-harness = { workspace = true }
