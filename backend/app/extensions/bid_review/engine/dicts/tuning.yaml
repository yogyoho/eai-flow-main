# bid_review 引擎调参(L2 调参外置 spec 2026-11-03 §2;默认值=引擎现状,改此文件即生效,
# gateway 进程 mtime 缓存热感知;非法值逐键回落默认)。
near_miss_gate: 0.75      # 近似门:池内 sim≥此值 → UNKNOWN(near_miss)
evidence_min_sim: 0.30    # 负证据 closest 滤噪下限
evidence_top_k: 3         # closest 最多条数

# 同义词组(L2 同义词外置 spec 2026-11-03):每组首元素=规范形,余为变体;组内最长
# 变体优先子串替换,单遍按声明序(规范形不含他组变体——组间耦合行为未定义)。
# 方向不明变体(副本/复印件/回执/正本)不入表=防静默升级 MATCHED(归近似门管)。
# 整节替换语义(改节=换全表);空节/坏组回落模块默认。
synonyms:
  - [营业执照, 企业法人营业执照]
  - [审计报告, 年度审计报告]
