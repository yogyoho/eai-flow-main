# 附件类型指纹字典(L2 指纹通道 spec 2026-11-04 §2.2,EAI-CUSTOM)
# 形状:类型名 → 内容自证性特征关键词组(文件标题/落款/字段名等"这类文件才会出现的词")。
# 原则:选内容自证词,避开泛词(如"证明""报告"单独出现不构成指纹);运维即改,mtime 热感知;
# 文件缺失/坏 yaml/全空 → {} = 无关键词提示,模型纯语义判定(弱而非坏,不阻断)。
