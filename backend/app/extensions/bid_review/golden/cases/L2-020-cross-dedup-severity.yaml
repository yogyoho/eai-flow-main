case: L2-020-cross-dedup-severity
desc: 同一附件实体(attachment:E-1,同名两行要求:行1 min_count=2 取走唯一一份成 PARTIAL,行2 零份成 MISSING)同触 L2-020 fatal 与 L2-024 major;实体键 no 通道对齐——list 端点跨层去重 related_issues 投影不在纯函数断言面(_cross_layer_group 由 test_bid_review_grouping 钉),此处钉双规则齐发+实体键一致,checklist unknown_count=0
fields:
  tender.attachment_requirements:
    - {'no': E-1, name: 业绩合同, min_count: 2}
    - {'no': E-1, name: 业绩合同}
  bid.attachment_index:
    - {'no': E-1, name: 业绩合同}
expect_issues:
  - rule_id: L2-020
    severity: fatal
    contains: ["附件缺失", "E-1"]
    entity: "attachment:E-1"
  - rule_id: L2-024
    severity: major
    contains: ["份数不足", "要求2份", "提供1份"]
    entity: "attachment:E-1"
expect_absent: []
strict: true
checklist:
  unknown_count: 0
  status_by_no: {"E-1": "PARTIAL"}
