case: L1-004-pm-qual-short
desc: 拟任项目负责人持证等级/社保月数/在建情况不符 det 粗筛命中(certs 非空=候选),scripted 模型确认 partial → L1-004 violation(fatal)
fields:
  bid.pm.certs: ["二级建造师"]
  bid.pm.social_months: 6
  bid.pm.on_other_project: true
  tender.pm_req.certs: ["一级建造师"]
  tender.pm_req.social_months: 12
  tender.pm_req.exclusive: true
model_script:
  L1-004: '{"verdicts": [{"clause_id": "PM-1", "verdict": "partial", "confidence": 0.9, "reason": "拟任项目负责人持二级建造师且社保6个月,不满足一级建造师/12个月/专职要求", "evidence": [{"doc_id": "bid.pdf", "page": 3, "text": "拟任项目负责人证书复印件"}]}]}'
expect_issues:
  - rule_id: L1-004
    severity: fatal
    contains: ["项目负责人资格", "与招标要求不符"]
expect_absent: []
strict: false
